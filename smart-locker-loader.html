<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Locker Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--text-secondary:#5f5e5a;--font-sans:"Lexend",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--text-secondary:#b4b2a9}}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans)}
svg{width:100%;max-width:420px;height:auto}

.fly{animation:fly 5s ease-in-out infinite;opacity:0}
.f2{animation-delay:.12s}.f3{animation-delay:.24s}.f4{animation-delay:.36s}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(1)}6%,16%{opacity:1;transform:translate(0,0) scale(1)}34%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(.35)}38%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.fx{transform-box:fill-box;transform-origin:center}
#pp{transform-box:fill-box;transform-origin:center;animation:pp 5s ease-in-out infinite}
@keyframes pp{0%,34%{transform:scale(1)}38%{transform:scale(1.07)}45%,100%{transform:scale(1)}}
.ln{transform-box:fill-box;transform-origin:left center;animation:ln 5s ease-out infinite;transform:scaleX(0)}
.l2{animation-delay:.12s}.l3{animation-delay:.24s}
@keyframes ln{0%,36%{transform:scaleX(0)}46%,94%{transform:scaleX(1)}99%,100%{transform:scaleX(0)}}
#bd{transform-box:fill-box;transform-origin:center;animation:bd 5s ease-out infinite;transform:scale(0)}
@keyframes bd{0%{transform:scale(0) rotate(0)}6%{transform:scale(1.15) rotate(0)}10%,49%{transform:scale(1) rotate(0)}52%{transform:scale(.86) rotate(-7deg)}55%{transform:scale(1.14) rotate(6deg)}58%{transform:scale(.96) rotate(-3deg)}61%{transform:scale(1) rotate(0)}70%{transform:scale(1.07) rotate(0)}78%{transform:scale(1) rotate(0)}86%{transform:scale(1.07) rotate(0)}94%{transform:scale(1) rotate(0)}99%,100%{transform:scale(0) rotate(0)}}
#shk{transform-box:fill-box;transform-origin:right bottom;animation:shk 5s ease-in-out infinite}
@keyframes shk{0%,6%{transform:rotate(0)}12%,44%{transform:rotate(40deg)}50%,100%{transform:rotate(0)}}
#rg{transform-box:fill-box;transform-origin:center;animation:rg 5s ease-out infinite;opacity:0}
@keyframes rg{0%,50%{transform:scale(1);opacity:0}52%{transform:scale(1);opacity:.8}66%{transform:scale(1.9);opacity:0}68%,69%{transform:scale(1);opacity:0}70%{transform:scale(1);opacity:.8}86%{transform:scale(1.9);opacity:0}100%{transform:scale(1.9);opacity:0}}
#wm{animation:wm 5s ease-out infinite;opacity:0}
@keyframes wm{0%,56%{opacity:0;transform:translateY(6px)}64%,93%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}
.tg{fill-opacity:0;animation:tg 5s ease-out infinite}
.t2{animation-delay:.25s}.t3{animation-delay:.5s}
@keyframes tg{0%,62%{fill-opacity:0}70%,93%{fill-opacity:1}98%,100%{fill-opacity:0}}
.st{fill-opacity:0;animation-duration:5s;animation-iteration-count:infinite}
.s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}
@keyframes s1{0%,2%{fill-opacity:0}6%,36%{fill-opacity:1}40%,100%{fill-opacity:0}}
@keyframes s2{0%,40%{fill-opacity:0}44%,60%{fill-opacity:1}64%,100%{fill-opacity:0}}
@keyframes s3{0%,62%{fill-opacity:0}66%,93%{fill-opacity:1}98%,100%{fill-opacity:0}}
</style>
</head>
<body>
<svg viewBox="0 0 380 300" role="img" aria-label="Smart Locker loading animation">
<title>Smart Locker signature loader</title>
<desc>Four small files labeled Marksheet, ID Card, Certificate and Resume fly from the corners into a document, lines draw in, a lock badge opens to let them in and snaps shut once they arrive, then bounces and pulses to show it is secured, then the Smart Locker wordmark and tagline appear.</desc>

<rect x="130" y="50" width="120" height="120" rx="28" fill="#3C3489"/>
<rect id="pp" x="158" y="72" width="64" height="80" rx="7" fill="#FFFFFF"/>
<rect class="ln" x="169" y="88" width="42" height="5" rx="2.5" fill="#AFA9EC"/>
<rect class="ln l2" x="169" y="101" width="42" height="5" rx="2.5" fill="#AFA9EC"/>
<rect class="ln l3" x="169" y="114" width="26" height="5" rx="2.5" fill="#AFA9EC"/>

<g transform="translate(24,20)"><g class="fly" style="--dx:155px;--dy:84px"><rect class="fx" width="22" height="16" rx="3" fill="#EF9F27"/><rect x="4" y="5" width="10" height="2" rx="1" fill="#FFFFFF"/><rect x="4" y="9" width="14" height="2" rx="1" fill="#FFFFFF"/><text x="11" y="31" text-anchor="middle" font-size="11" fill="var(--text-secondary)" style="font-family:var(--font-sans)">Marksheet</text></g></g>
<g transform="translate(324,20)"><g class="fly f2" style="--dx:-145px;--dy:84px"><rect class="fx" width="22" height="16" rx="3" fill="#D85A30"/><rect x="4" y="5" width="10" height="2" rx="1" fill="#FFFFFF"/><rect x="4" y="9" width="14" height="2" rx="1" fill="#FFFFFF"/><text x="11" y="31" text-anchor="middle" font-size="11" fill="var(--text-secondary)" style="font-family:var(--font-sans)">ID Card</text></g></g>
<g transform="translate(24,196)"><g class="fly f3" style="--dx:155px;--dy:-92px"><rect class="fx" width="22" height="16" rx="3" fill="#378ADD"/><rect x="4" y="5" width="10" height="2" rx="1" fill="#FFFFFF"/><rect x="4" y="9" width="14" height="2" rx="1" fill="#FFFFFF"/><text x="11" y="31" text-anchor="middle" font-size="11" fill="var(--text-secondary)" style="font-family:var(--font-sans)">Certificate</text></g></g>
<g transform="translate(324,196)"><g class="fly f4" style="--dx:-145px;--dy:-92px"><rect class="fx" width="22" height="16" rx="3" fill="#D4537E"/><rect x="4" y="5" width="10" height="2" rx="1" fill="#FFFFFF"/><rect x="4" y="9" width="14" height="2" rx="1" fill="#FFFFFF"/><text x="11" y="31" text-anchor="middle" font-size="11" fill="var(--text-secondary)" style="font-family:var(--font-sans)">Resume</text></g></g>

<circle id="rg" cx="224" cy="138" r="28" fill="none" stroke="#1D9E75" stroke-width="2"/>
<g id="bd">
<circle cx="224" cy="138" r="28" fill="#1D9E75" stroke="#3C3489" stroke-width="5"/>
<path id="shk" d="M216 137 V131 a8 8 0 0 1 16 0 V137" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
<rect x="211" y="136" width="26" height="20" rx="4" fill="#FFFFFF"/>
<circle cx="224" cy="144" r="3" fill="#1D9E75"/>
<rect x="223" y="145" width="2" height="6" rx="1" fill="#1D9E75"/>
</g>

<text id="wm" x="190" y="219" text-anchor="middle" font-size="30" style="font-family:var(--font-sans);font-weight:500;letter-spacing:.5px"><tspan fill="#7F77DD">Smart</tspan> <tspan fill="#1D9E75">Locker</tspan></text>
<text x="190" y="244" text-anchor="middle" font-size="13" style="font-family:var(--font-sans);letter-spacing:1px"><tspan class="tg" fill="#FFFFFF">Secure,</tspan> <tspan class="tg t2" fill="#FFFFFF">Private,</tspan> <tspan class="tg t3" fill="#FFFFFF">Personal</tspan></text>

<g font-size="13" text-anchor="middle" style="font-family:var(--font-sans)">
<text class="st s1" x="190" y="284" fill="var(--text-secondary)">Unlocking to receive your documents...</text>
<text class="st s2" x="190" y="284" fill="var(--text-secondary)">Locking it all in...</text>
<text class="st s3" x="190" y="284" fill="var(--text-secondary)">Safe and sound.</text>
</g>
</svg>
</body>
</html>
