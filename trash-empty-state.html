<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --out: cubic-bezier(.16, 1, .3, 1);
    --ink: #0f172a;
    --text: #64748b;
    --red: #ef4444;
    --T: 5.6s;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; align-items: start; padding: 20px;
    font-family: Lexend, Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: #f9fafc;
  }

  /* ---------- panel (matches the screenshot) ---------- */
  .panel {
    width: min(1020px, 100%); margin: 0 auto; padding: 44px 20px 56px; border-radius: 34px;
    background: #fff; border: 1px solid #eef1f6; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 30px -18px rgba(40,60,140,.18);
    display: grid; justify-items: center; text-align: center;
  }

  .stage { position: relative; width: 280px; height: 240px; }
  .stage > * { position: absolute; }

  /* ---------- trash bin (the destination) ---------- */
  .bin {
    left: 50%; top: 130px; width: 100px; height: 100px; margin-left: -50px; border-radius: 50%; z-index: 3;
    display: grid; place-items: center; background: #f4f7fb;
    animation: squash var(--T) infinite, disc var(--T) linear infinite;
  }
  @keyframes squash {
    0%, 60% { transform: scale(1); }
    61%     { transform: scale(1.12, .88); }
    63%     { transform: scale(.95, 1.07); }
    65%     { transform: scale(1.03, .98); }
    67%, 100% { transform: scale(1); }
  }
  @keyframes disc {
    0%, 60% { background-color: #f4f7fb; }
    63%, 82% { background-color: #fee2e2; }
    91%, 100% { background-color: #f4f7fb; }
  }
  .bin svg {
    width: 48px; height: 48px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    color: #cbd5e1; animation: binColor var(--T) linear infinite;
  }
  @keyframes binColor { 0%, 60% { color: #cbd5e1; } 63%, 82% { color: #ef4444; } 91%, 100% { color: #cbd5e1; } }
  .lid { transform-origin: 3px 6px; animation: lid var(--T) infinite; }
  @keyframes lid {
    0%, 47%  { transform: rotate(0deg); }
    53%      { transform: rotate(-32deg); animation-timing-function: ease-in; }
    59%      { transform: rotate(-32deg); }
    61.5%    { transform: rotate(7deg); }
    63.5%    { transform: rotate(-5deg); }
    65.5%, 100% { transform: rotate(0deg); }
  }

  .ring { left: 50%; top: 130px; width: 100px; height: 100px; margin-left: -50px; border-radius: 50%; border: 3px solid #fca5a5; opacity: 0; animation: ring var(--T) ease-out infinite; }
  @keyframes ring { 0%, 60% { opacity: 0; scale: .7; } 62% { opacity: .75; scale: .85; } 76%, 100% { opacity: 0; scale: 2; } }

  .sp { left: 50%; top: 180px; width: 7px; height: 7px; margin: -3px 0 0 -3px; border-radius: 50%; background: #f87171; opacity: 0; z-index: 4; animation: spark var(--T) ease-out infinite; }
  .sp:nth-of-type(even) { background: #94a3b8; width: 6px; height: 6px; }
  @keyframes spark { 0%, 61% { opacity: 0; translate: 0 0; scale: .3; } 63% { opacity: 1; } 77%, 100% { opacity: 0; translate: var(--x) var(--y); scale: 1; } }

  /* ---------- file card ---------- */
  .card {
    left: 50%; top: 6px; width: 96px; height: 100px; margin-left: -48px; padding: 10px; border-radius: 14px; z-index: 2;
    background: #fff; border: 1px solid #e6ebf5; box-shadow: 0 14px 26px -12px rgba(30,41,90,.35);
    display: grid; align-content: start; gap: 7px; opacity: 0; animation: card var(--T) linear infinite;
  }
  @keyframes card {
    0%       { opacity: 0; transform: translateY(-16px) scale(.92); animation-timing-function: cubic-bezier(.16,1,.3,1); }
    12.5%    { opacity: 1; transform: none; }
    46%      { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.5,0,.9,.4); }
    56%      { opacity: 1; transform: translateY(80px) scale(.45); animation-timing-function: linear; }
    59%      { opacity: 0; transform: translateY(96px) scale(.3); }
    100%     { opacity: 0; transform: translateY(96px) scale(.3); }
  }
  .card .tag { justify-self: start; font-size: 9px; font-weight: 700; letter-spacing: .05em; color: #fff; background: #3b82f6; padding: 2px 6px; border-radius: 5px; }
  .card .ln { display: block; height: 4px; border-radius: 2px; background: #e3e8f4; }
  .card .ln.s { width: 60%; }
  .card .name { margin-top: 2px; font-size: 10px; font-weight: 600; color: #3b4a68; }

  .trash-btn {
    position: absolute; right: 7px; top: 7px; width: 22px; height: 22px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px -2px rgba(30,41,90,.35); display: grid; place-items: center; animation: tbtn var(--T) linear infinite;
  }
  @keyframes tbtn {
    0%, 33%  { background-color: #fff; scale: 1; }
    34%      { background-color: #fee2e2; scale: 1.6; animation-timing-function: ease-out; }
    39%, 100%{ background-color: #fee2e2; scale: 1; }
  }
  .trash-btn svg { width: 12px; height: 12px; fill: none; stroke: #b4bfd3; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; animation: tbtnIcon var(--T) linear infinite; }
  @keyframes tbtnIcon { 0%, 33% { stroke: #b4bfd3; } 34%, 100% { stroke: #ef4444; } }
  .bp { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: #f87171; opacity: 0; animation: burst var(--T) ease-out infinite; }
  .bp:nth-child(even) { background: #94a3b8; }
  @keyframes burst { 0%, 33% { opacity: 0; translate: 0 0; scale: .4; } 35% { opacity: 1; } 45%, 100% { opacity: 0; translate: var(--x) var(--y); scale: 1; } }

  /* ---------- cursor ---------- */
  .cursor { left: 50%; top: 0; width: 22px; height: 22px; opacity: 0; z-index: 5; pointer-events: none; filter: drop-shadow(0 3px 4px rgba(15,23,42,.35)); animation: cursor var(--T) linear infinite; }
  .cursor svg { width: 100%; height: 100%; display: block; }
  @keyframes cursor {
    0%, 14%  { opacity: 0; translate: 120px 84px; scale: 1; }
    18%      { opacity: 1; translate: 110px 74px; animation-timing-function: cubic-bezier(.65,0,.35,1); }
    32%      { opacity: 1; translate: 26px 22px; scale: 1; }
    34%      { translate: 26px 22px; scale: .8; }
    37%      { translate: 26px 22px; scale: 1; }
    46%      { opacity: 1; translate: 36px 32px; }
    52%, 100%{ opacity: 0; translate: 52px 46px; }
  }

  /* ---------- text ---------- */
  h2 { margin: 4px 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -.005em; animation: textIn .9s var(--out) both; }
  .panel p { margin: 0; font-size: 18px; font-weight: 500; line-height: 1.5; color: var(--text); animation: textIn .9s var(--out) .12s both; }
  @keyframes textIn { from { opacity: 0; transform: translateY(12px); } }

  @media (max-width: 520px) { .panel { padding-top: 32px; } h2 { font-size: 20px; } .panel p { font-size: 16px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .card, .cursor, .ring, .sp, .bp { display: none; }
  }
</style>
</head>
<body>

<section class="panel">
  <div class="stage" aria-hidden="true">

    <div class="ring"></div>

    <!-- file card with its own delete button -->
    <div class="card">
      <b class="tag">DOC</b>
      <i class="ln"></i><i class="ln"></i><i class="ln s"></i>
      <span class="name">Notes.docx</span>
      <span class="trash-btn">
        <i class="bp" style="--x:-16px;--y:-14px"></i>
        <i class="bp" style="--x:15px;--y:-16px"></i>
        <i class="bp" style="--x:-19px;--y:4px"></i>
        <i class="bp" style="--x:18px;--y:6px"></i>
        <i class="bp" style="--x:0px;--y:-22px"></i>
        <i class="bp" style="--x:-4px;--y:18px"></i>
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
      </span>
    </div>

    <!-- trash bin -->
    <div class="bin">
      <svg viewBox="0 0 24 24">
        <g class="lid"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></g>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
      </svg>
    </div>

    <i class="sp" style="--x:-62px;--y:-30px"></i>
    <i class="sp" style="--x:60px;--y:-36px"></i>
    <i class="sp" style="--x:-76px;--y:8px"></i>
    <i class="sp" style="--x:74px;--y:10px"></i>
    <i class="sp" style="--x:-34px;--y:-58px"></i>
    <i class="sp" style="--x:36px;--y:-56px"></i>

    <!-- cursor -->
    <div class="cursor"><svg viewBox="0 0 24 24"><path d="M4 2l15 9.500-6.500 1.500 3.500 7-3 1.500-3.500-7L4 19.500z" fill="#0f172a" stroke="#fff" stroke-width="1.600" stroke-linejoin="round"/></svg></div>
  </div>

  <h2>Trash is empty</h2>
  <p>No files have been deleted.</p>
</section>

</body>
</html>
