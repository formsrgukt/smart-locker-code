<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart Button</title>
<style>
  :root {
    --out: cubic-bezier(.16, 1, .3, 1);
    --page: #f6f8fb;
    --card: #ffffff;
    --border: #e4e9f1;
    --idle: #5b7db8;
    --red: #ff3b5c;
    --red-soft: #fff0f3;
    --muted: #7a879c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0f1218; --card: #171b23; --border: #2a3140;
      --idle: #86a4d8; --red: #ff5573; --red-soft: #2a1519; --muted: #8b97ad;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: var(--page); font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif;
  }

  .like {
    position: relative; width: 56px; height: 56px; padding: 0; border-radius: 18px;
    display: grid; place-items: center; cursor: pointer;
    background: var(--card); border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(20,30,55,.05);
    transition: background-color .7s var(--out), border-color .7s var(--out), box-shadow .5s var(--out), transform .5s var(--out);
    -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  }
  .like:hover { box-shadow: 0 8px 22px rgba(20,30,55,.1); transform: translateY(-1px); }
  .like:active { transform: scale(.95); transition-duration: .12s; }
  .like:focus-visible { outline: 3px solid color-mix(in srgb, var(--red) 55%, transparent); outline-offset: 3px; }
  .like[aria-pressed="true"] { background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 32%, transparent); }

  .icon { position: relative; width: 30px; height: 30px; }
  .heart { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; transform-origin: 50% 62%; will-change: transform; }
  .fx { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; overflow: visible; pointer-events: none; }

  .outline { fill: none; stroke: var(--idle); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .fill    { fill: var(--red); stroke: var(--red); stroke-width: 1.8; stroke-linejoin: round; }
  .trim    { fill: none; stroke: var(--red); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; stroke-dashoffset: 1.06; }
  .shine   { fill: none; stroke: rgba(255,255,255,.8); stroke-width: 1.5; stroke-linecap: round; }

  .hint { margin: 0; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<button class="like" id="like" type="button" aria-pressed="false" aria-label="Like">
  <span class="icon" aria-hidden="true">

    <!-- effects layer: glow, ring, sparks, dots, floating hearts (drawn by script) -->
    <svg class="fx" viewBox="-60 -60 120 120">
      <defs>
        <radialGradient id="glowGrad">
          <stop offset="0" stop-color="#ff3b5c" stop-opacity=".55"/>
          <stop offset="1" stop-color="#ff3b5c" stop-opacity="0"/>
        </radialGradient>
        <symbol id="mh" viewBox="0 0 24 24">
          <path d="M12 21s-8-5-9.5-10.2C1.4 7 3.8 4 7 4c2 0 3.8 1.2 5 3 1.2-1.8 3-3 5-3 3.2 0 5.6 3 4.5 6.8C20 16 12 21 12 21z"/>
        </symbol>
      </defs>
      <circle id="glow" r="26" fill="url(#glowGrad)" opacity="0"/>
      <circle id="ring" r="12" fill="none" stroke="#ff3b5c" stroke-width="2" opacity="0"/>
      <g id="sparks"></g>
      <g id="dots"></g>
      <g id="minis"></g>
    </svg>

    <svg class="heart" id="heart" viewBox="0 0 24 24">
      <defs>
        <clipPath id="wipe"><circle id="wipeC" cx="12" cy="13" r="0"/></clipPath>
      </defs>
      <path class="outline" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      <path class="fill" clip-path="url(#wipe)" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      <!-- trim-path strokes: draw outward from the bottom tip, both sides at once -->
      <path class="trim" id="trimL" pathLength="1" d="M12 21l-7-7c-1.5-1.45-3-3.2-3-5.5A5.5 5.5 0 0 1 7.5 3c1.76 0 3 .5 4.5 2"/>
      <path class="trim" id="trimR" pathLength="1" d="M12 21l7-7c1.5-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2"/>
      <path class="shine" id="shine" pathLength="1" d="M5.2 8.4c.35-1.7 1.5-2.8 3.2-2.9" stroke-dasharray="0 1" opacity="0"/>
    </svg>
  </span>
</button>

<p class="hint">Click the heart to try it</p>

<script>
(() => {
  /* =================================================================
     Tiny motion engine: spring physics + eased tweens on one rAF loop.
     Springs keep their velocity when interrupted, so every change of
     direction stays fluid (the "After Effects" feel).
     ================================================================= */
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const btn = $('like'), heart = $('heart');
  const trimL = $('trimL'), trimR = $('trimR'), wipeC = $('wipeC'), shine = $('shine');
  const glow = $('glow'), ring = $('ring');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* easing */
  const c01 = v => Math.min(1, Math.max(0, v));
  const E = {
    lin: x => x,
    outCubic: x => 1 - Math.pow(1 - x, 3),
    inCubic: x => x * x * x,
    inQuad: x => x * x,
    inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
    outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
    outBack: x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  };

  /* state */
  const S = { x: 1, v: 0, t: 1, k: 260, c: 20 };   // scale spring
  const R = { x: 0, v: 0, t: 0, k: 200, c: 16 };   // rotation spring (deg)
  const HID = 1.06;
  let trimV = HID, wipeV = 0;
  let liked = false, hover = false, pressing = false, popUntil = 0;
  let raf = 0, last = 0;
  const tweens = new Map(), timers = [];

  const base = () => pressing ? .86 : hover ? 1.1 : 1;

  function play(key, o) {
    tweens.set(key, { t0: performance.now() + (o.delay || 0), dur: o.dur, ease: o.ease, from: o.from, to: o.to, fn: o.fn });
    wake();
  }
  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }

  function stepSpring(sp, dt) {
    const n = Math.ceil(dt / (1 / 240)), h = dt / n;
    for (let i = 0; i < n; i++) { sp.v += (-sp.k * (sp.x - sp.t) - sp.c * sp.v) * h; sp.x += sp.v * h; }
  }
  const settled = sp => Math.abs(sp.x - sp.t) < .0004 && Math.abs(sp.v) < .004;

  function loop(t) {
    const dt = Math.min((t - last) / 1000, 1 / 30); last = t;
    stepSpring(S, dt); stepSpring(R, dt);

    for (let i = timers.length - 1; i >= 0; i--) if (t >= timers[i].at) { const f = timers[i].fn; timers.splice(i, 1); f(); }

    for (const [key, tw] of tweens) {
      let p = (t - tw.t0) / tw.dur; if (p < 0) continue;
      p = Math.min(1, p);
      tw.fn(tw.from + (tw.to - tw.from) * tw.ease(p));
      if (p >= 1) tweens.delete(key);
    }

    heart.style.transform = `scale(${S.x.toFixed(4)}) rotate(${R.x.toFixed(3)}deg)`;

    if (!settled(S) || !settled(R) || tweens.size || timers.length) raf = requestAnimationFrame(loop);
    else { S.x = S.t; S.v = 0; R.x = R.t; R.v = 0; heart.style.transform = `scale(${S.x}) rotate(${R.x}deg)`; raf = 0; }
  }

  /* ---------- heart layers ---------- */
  const setTrim = v => { trimV = v; trimL.style.strokeDashoffset = v; trimR.style.strokeDashoffset = v; };
  const setWipe = v => { wipeV = v; wipeC.setAttribute('r', v.toFixed(3)); };

  function fillIn() {
    play('trim', { dur: 520, ease: E.inOutCubic, from: trimV, to: 0, fn: setTrim });
    play('wipe', { delay: 120, dur: 560, ease: E.outCubic, from: wipeV, to: 15, fn: setWipe });
    play('shine', { delay: 200, dur: 520, ease: E.lin, from: 0, to: 1, fn: p => {
      shine.setAttribute('opacity', Math.sin(p * Math.PI).toFixed(3));
      shine.setAttribute('stroke-dasharray', `${(0.5 * Math.sin(p * Math.PI)).toFixed(3)} 1`);
      shine.setAttribute('stroke-dashoffset', (-p * .5).toFixed(3));
    }});
  }
  function fillOut() {
    play('trim', { dur: 320, ease: E.inOutCubic, from: trimV, to: HID, fn: setTrim });
    play('wipe', { dur: 300, ease: E.inCubic, from: wipeV, to: 0, fn: setWipe });
  }

  /* ---------- particles ---------- */
  const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); parent.appendChild(el); return el; };
  const colors = ['#ff3b5c', '#ff8aa0', '#ffb347'];

  const sparks = [...Array(8)].map((_, i) => ({
    el: mk('line', { 'stroke-width': 2.2, 'stroke-linecap': 'round', stroke: colors[i % 3], opacity: 0 }, $('sparks')),
    a: i * Math.PI / 4, delay: (i % 2) * 35
  }));
  const dots = [...Array(8)].map((_, i) => ({
    el: mk('circle', { r: 0, fill: colors[(i + 1) % 3], opacity: 0 }, $('dots')),
    a: i * Math.PI / 4 + Math.PI / 8, reach: 18 + (i % 3) * 6, delay: 40 + (i % 3) * 25, size: 2.4 + (i % 2) * .8
  }));
  const minis = [
    { x: -15, rot: -26, delay: 70,  size: 13, c: '#ff3b5c' },
    { x:  14, rot:  22, delay: 130, size: 11, c: '#ff8aa0' },
    { x:   1, rot:  -8, delay: 200, size: 9,  c: '#ff6b86' }
  ].map(m => {
    const g = mk('g', { opacity: 0 }, $('minis'));
    mk('use', { href: '#mh', width: m.size, height: m.size, x: -m.size / 2, y: -m.size / 2, fill: m.c }, g);
    return { ...m, g };
  });

  function renderFx(ms) {
    /* glow */
    let p = c01(ms / 850);
    glow.setAttribute('opacity', (Math.sin(p * Math.PI) * .9).toFixed(3));
    glow.setAttribute('r', (16 + E.outCubic(p) * 22).toFixed(2));

    /* ring */
    p = c01(ms / 700);
    ring.setAttribute('r', (12 + E.outExpo(p) * 20).toFixed(2));
    ring.setAttribute('stroke-width', (2.6 * (1 - p) + .3).toFixed(2));
    ring.setAttribute('opacity', (Math.pow(1 - p, 1.6) * .75).toFixed(3));

    /* sparks: the line grows, then its tail catches up and it disappears */
    for (const s of sparks) {
      p = c01((ms - s.delay) / 640);
      const outer = 14 + E.outExpo(p) * 22;
      const inner = 14 + (outer - 14) * E.inOutCubic(c01((p - .12) / .88));
      const cx = Math.cos(s.a), cy = Math.sin(s.a);
      s.el.setAttribute('x1', (cx * inner).toFixed(2)); s.el.setAttribute('y1', (cy * inner).toFixed(2));
      s.el.setAttribute('x2', (cx * outer).toFixed(2)); s.el.setAttribute('y2', (cy * outer).toFixed(2));
      s.el.setAttribute('opacity', p > 0 && p < 1 ? 1 : 0);
    }

    /* dots: shoot out with expo ease and shrink away */
    for (const d of dots) {
      p = c01((ms - d.delay) / 760);
      const dist = 13 + E.outExpo(p) * d.reach;
      d.el.setAttribute('cx', (Math.cos(d.a) * dist).toFixed(2));
      d.el.setAttribute('cy', (Math.sin(d.a) * dist).toFixed(2));
      d.el.setAttribute('r', (d.size * (1 - E.inQuad(p))).toFixed(2));
      d.el.setAttribute('opacity', p > 0 && p < 1 ? 1 : 0);
    }

    /* floating hearts: rise, sway, pop in with overshoot, fade out */
    for (const m of minis) {
      p = c01((ms - m.delay) / 1000);
      const y = -E.outCubic(p) * 44 - 8;
      const x = m.x * E.outCubic(p) + Math.sin(p * Math.PI * 2.2) * 3.5 * p;
      const sc = E.outBack(c01(p / .28)) * (1 - E.inQuad(c01((p - .55) / .45)));
      const rot = m.rot * Math.sin(p * Math.PI * 1.4);
      m.g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot.toFixed(1)}) scale(${Math.max(sc, 0).toFixed(3)})`);
      m.g.setAttribute('opacity', p > 0 && p < 1 ? 1 : 0);
    }
  }

  /* ---------- interaction ---------- */
  function idleSprings() {
    if (performance.now() > popUntil) { S.k = 260; S.c = 20; R.k = 200; R.c = 16; }
    S.t = base(); R.t = 0; wake();
  }
  btn.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { hover = true; idleSprings(); } });
  btn.addEventListener('pointerleave', () => { hover = false; pressing = false; idleSprings(); });
  btn.addEventListener('pointerdown',  () => { pressing = true; S.k = 520; S.c = 34; S.t = base(); wake(); });
  btn.addEventListener('pointerup',    () => { pressing = false; });
  btn.addEventListener('pointercancel',() => { pressing = false; idleSprings(); });

  btn.addEventListener('click', () => {
    liked = !liked;
    btn.setAttribute('aria-pressed', String(liked));
    btn.setAttribute('aria-label', liked ? 'Unlike' : 'Like');
    btn.dispatchEvent(new CustomEvent('like-change', { detail: { liked } }));

    if (reduce) { setTrim(liked ? 0 : HID); setWipe(liked ? 15 : 0); return; }

    const t0 = performance.now();
    timers.length = 0;

    if (liked) {
      /* 1. anticipation: quick squash + lean */
      S.k = 600; S.c = 40; S.t = .8;
      R.k = 600; R.c = 40; R.t = -8;
      popUntil = t0 + 1000;
      /* 2. release: spring overshoots, trim-path draws, burst fires */
      timers.push({ at: t0 + 95, fn: () => {
        pressing = false;
        S.k = 215; S.c = 9.5; S.v += 6.5; S.t = base();
        R.k = 170; R.c = 8;   R.v += 110; R.t = 0;
        fillIn();
        play('fx', { dur: 1150, ease: E.lin, from: 0, to: 1150, fn: renderFx });
      }});
    } else {
      S.k = 520; S.c = 36; S.t = .78;
      R.k = 520; R.c = 36; R.t = 6;
      popUntil = t0 + 800;
      timers.push({ at: t0 + 75, fn: () => {
        pressing = false;
        S.k = 200; S.c = 9; S.v += 3; S.t = base();
        R.k = 170; R.c = 9; R.v -= 60; R.t = 0;
        fillOut();
      }});
    }
    wake();
  });
})();
</script>
</body>
</html>
