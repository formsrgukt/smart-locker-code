<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back button · Pill expand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0f172a; --blue: #155dfc; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; min-height: 100vh; font-family: Lexend, Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: #f9fafc; }

  /* demo header (matches the app) */
  .head {
    max-width: 920px; margin: 0 auto; height: 78px; padding: 0 28px; border-radius: 24px; background: #fff; border: 1px solid #eef1f6;
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 26px -18px rgba(40,60,140,.2); display: flex; align-items: center; gap: 18px;
  }
  .head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }

  /* ================= Back button · Pill expand ================= */
  .back {
    display: inline-flex; align-items: center; gap: 8px; width: 40px; height: 40px; padding: 0 10px; border: 0; border-radius: 20px;
    overflow: hidden; white-space: nowrap; cursor: pointer;
    background: #eef4ff; color: var(--blue); font: 500 14px/1 Lexend, sans-serif;
    transition: width .35s cubic-bezier(.4, 0, .2, 1), background-color .2s ease, scale .15s ease;
  }
  .back svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
  .back span { opacity: 0; transition: opacity .2s ease; }

  .back:hover, .back:focus-visible { width: 94px; background: #dbe7ff; }
  .back:hover span, .back:focus-visible span { opacity: 1; transition-delay: .1s; }
  .back:hover svg, .back:focus-visible svg { transform: translateX(-1px); }
  .back:active { scale: .97; }
  .back:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { .back, .back svg, .back span { transition-duration: .01ms; } }
</style>
</head>
<body>

<div class="head">
  <button class="back" type="button" aria-label="Back">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    <span>Back</span>
  </button>
  <h1>Collections</h1>
</div>

</body>
</html>
