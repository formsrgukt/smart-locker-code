<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Personal Info</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --cycle: 7s; --ease: cubic-bezier(.4, 0, .2, 1); --blue: #1a5cff; --green: #16a34a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f1f3f7; font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  }
  @media (prefers-color-scheme: dark) { body { background: #101216; } }

  .card {
    position: relative; width: 236px; height: 152px; padding: 0; border-radius: 28px;
    background: #fff; border: 1px solid #e5e7eb; color: #374151; cursor: pointer; overflow: hidden; isolation: isolate;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    animation: border var(--cycle) var(--ease) infinite;
    transition: transform .15s var(--ease), box-shadow .25s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover { box-shadow: 0 8px 22px rgba(15,23,42,.08); }
  .card:active { transform: scale(.97); }
  .card:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  @keyframes border {
    0%, 44% { border-color: #e5e7eb; } 52%, 82% { border-color: #bbf7d0; } 90%, 100% { border-color: #e5e7eb; }
  }

  /* One shared timeline (--cycle). Story:
     0-10%   idle (original card)
     14-40%  an info card appears; avatar fills in, detail lines write out
     44-52%  green check badge confirms the save
     49-82%  "Info saved"
     90-100% back to idle */

  .glow {
    position: absolute; z-index: -1; inset: 0; opacity: 0;
    background: radial-gradient(circle at 50% 36%, rgba(26,92,255,.13), transparent 62%);
    animation: glow var(--cycle) var(--ease) infinite;
  }
  @keyframes glow { 0%, 44% { opacity: 0; } 52% { opacity: 1; } 68%, 100% { opacity: 0; } }

  .stage { display: grid; place-items: center; width: 80px; height: 60px; }
  .stage > * { grid-area: 1 / 1; }

  /* Idle icon */
  .circle {
    width: 50px; height: 50px; border-radius: 50%; background: #f3f4f6;
    display: grid; place-items: center; animation: circleVis var(--cycle) var(--ease) infinite;
  }
  .circle svg { width: 24px; height: 24px; }
  .circle circle, .circle path { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: round; }
  @keyframes circleVis {
    0%, 8% { opacity: 1; transform: scale(1); } 12%, 88% { opacity: 0; transform: scale(.6); }
    94%, 100% { opacity: 1; transform: scale(1); }
  }

  /* Info card scene */
  .scene { position: relative; display: grid; place-items: center; }
  .idcard {
    position: relative; width: 66px; height: 44px; border-radius: 10px; opacity: 0;
    background: #f8fafc; border: 1.5px solid #cbd5e1;
    animation: idcard var(--cycle) var(--ease) infinite;
  }
  @keyframes idcard {
    0%, 10% { opacity: 0; transform: scale(.7); }
    15%, 43% { opacity: 1; transform: scale(1); }
    46% { opacity: 1; transform: scale(1.06); }
    50%, 84% { opacity: 1; transform: scale(1); }
    90%, 100% { opacity: 0; transform: scale(.85); }
  }

  .avatar {
    position: absolute; left: 8px; top: 50%; margin-top: -10px; width: 20px; height: 20px; border-radius: 50%;
    background: #cbd5e1; display: grid; place-items: center; transform: scale(0);
    animation: avatar var(--cycle) var(--ease) infinite;
  }
  .avatar svg { width: 13px; height: 13px; }
  .avatar circle, .avatar path { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  @keyframes avatar {
    0%, 16% { transform: scale(0); background: #cbd5e1; }
    22% { transform: scale(1.12); }
    25% { transform: scale(1); }
    32%, 100% { transform: scale(1); background: var(--blue); }
  }

  .ln { position: absolute; left: 35px; height: 3px; border-radius: 2px; background: #94a3b8; transform: scaleX(0); transform-origin: left; }
  .ln1 { top: 11px; width: 24px; animation: ln1 var(--cycle) var(--ease) infinite; }
  .ln2 { top: 20px; width: 18px; animation: ln2 var(--cycle) var(--ease) infinite; }
  .ln3 { top: 29px; width: 12px; animation: ln3 var(--cycle) var(--ease) infinite; }
  @keyframes ln1 { 0%, 24% { transform: scaleX(0); } 29%, 100% { transform: scaleX(1); } }
  @keyframes ln2 { 0%, 29% { transform: scaleX(0); } 34%, 100% { transform: scaleX(1); } }
  @keyframes ln3 { 0%, 34% { transform: scaleX(0); } 39%, 100% { transform: scaleX(1); } }

  .badge {
    position: absolute; right: -8px; bottom: -8px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--green); display: grid; place-items: center; border: 2px solid #fff;
    transform: scale(0); animation: badge var(--cycle) var(--ease) infinite;
  }
  @keyframes badge { 0%, 43% { transform: scale(0); } 48% { transform: scale(1.15); } 51%, 100% { transform: scale(1); } }
  .badge svg { width: 12px; height: 12px; }
  .badge path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; animation: tick var(--cycle) var(--ease) infinite; }
  @keyframes tick { 0%, 48% { stroke-dashoffset: 20; } 55%, 100% { stroke-dashoffset: 0; } }

  /* Labels: Add Personal Info -> Filling in your details -> Info saved */
  .labels { display: grid; place-items: center; width: 200px; height: 48px; }
  .labels span {
    grid-area: 1 / 1; font-size: 17px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em;
    color: #2b3445; text-align: center; text-wrap: balance; will-change: transform, opacity;
  }
  .l-idle { animation: lIdle var(--cycle) var(--ease) infinite; }
  .l-up { opacity: 0; animation: lUp var(--cycle) var(--ease) infinite; }
  .l-saved { opacity: 0; animation: lSaved var(--cycle) var(--ease) infinite; }
  @keyframes lIdle { 0%, 8% { opacity: 1; transform: none; } 11%, 88% { opacity: 0; transform: translateY(-8px); } 89% { opacity: 0; transform: translateY(8px); } 94%, 100% { opacity: 1; transform: none; } }
  @keyframes lUp { 0%, 13% { opacity: 0; transform: translateY(8px); } 16%, 38% { opacity: 1; transform: none; } 41%, 100% { opacity: 0; transform: translateY(-8px); } }
  @keyframes lSaved { 0%, 46% { opacity: 0; transform: translateY(8px); } 50%, 82% { opacity: 1; transform: none; } 86%, 100% { opacity: 0; transform: translateY(-8px); } }

  @media (prefers-reduced-motion: reduce) {
    .card, .glow, .circle, .idcard, .avatar, .ln, .badge, .badge path, .labels span { animation: none; }
  }
</style>
</head>
<body>

<button class="card" type="button" aria-label="Add personal info">
  <span class="glow"></span>

  <span class="stage">
    <span class="circle">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.9 3.1-6 7-6s7 2.1 7 6"/>
      </svg>
    </span>

    <span class="scene" aria-hidden="true">
      <span class="idcard">
        <span class="avatar">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.4"/><path d="M5.5 20c0-3.6 2.9-5.6 6.5-5.6s6.5 2 6.5 5.6"/></svg>
        </span>
        <span class="ln ln1"></span><span class="ln ln2"></span><span class="ln ln3"></span>
        <span class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      </span>
    </span>
  </span>

  <span class="labels">
    <span class="l-idle">Add Personal<br>Info</span>
    <span class="l-up">Adding details…</span>
    <span class="l-saved">Details saved</span>
  </span>
</button>

</body>
</html>
