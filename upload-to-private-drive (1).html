<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload to Private Drive</title>
<style>
  :root {
    --cycle: 7.6s;   /* ~3s idle + ~4s upload sequence + return */
    --out: cubic-bezier(.22, 1, .36, 1);
    --inout: cubic-bezier(.65, 0, .35, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f6f7f9; font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #101216; } }

  .upload {
    position: relative; width: 236px; height: 152px; padding: 0; border: 0; border-radius: 28px;
    background: #1a5cff; color: #fff; cursor: pointer; overflow: hidden; isolation: isolate;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 10px 24px rgba(26,92,255,.35);
    transition: transform .3s var(--out), box-shadow .3s var(--out);
    -webkit-tap-highlight-color: transparent;
  }
  .upload:hover { box-shadow: 0 14px 30px rgba(26,92,255,.45); }
  .upload:active { transform: scale(.97); transition-duration: .12s; }
  .upload:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }

  /* Timeline (% of 7.6s):
     0-38%    upload symbol on screen (~3s), arrow bobs + ripple ring pulses
     38-46%   symbol melts away, document rises
     46-60%   document glides into drive, progress fills
     60-72%   lock springs in, shackle closes, glow blooms
     66-82%   "Saved to Private Drive"
     83-96%   everything eases back to the upload symbol */

  .upload > * { will-change: transform, opacity; }

  .glow {
    position: absolute; z-index: -1; inset: 0; opacity: 0;
    background: radial-gradient(circle at 50% 36%, rgba(255,255,255,.4), transparent 62%);
    animation: glow var(--cycle) linear infinite;
  }
  @keyframes glow {
    0%, 61% { opacity: 0; animation-timing-function: var(--out); }
    68.5%   { opacity: 1; animation-timing-function: var(--inout); }
    87%, 100% { opacity: 0; }
  }

  .stage { display: grid; place-items: center; width: 80px; height: 60px; }
  .stage > * { grid-area: 1 / 1; }

  /* Upload symbol */
  .circle {
    position: relative;
    width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.2);
    display: grid; place-items: center; animation: circleVis var(--cycle) linear infinite;
  }
  .circle::after {                       /* ripple ring */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.7); opacity: 0;
    animation: ring 1.5s var(--out) infinite;
  }
  .circle svg { width: 26px; height: 26px; animation: arrowBob 1.5s ease-in-out infinite; }
  .circle path { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes ring {
    0%   { transform: scale(1);   opacity: .6; }
    80%, 100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes arrowBob {
    0%, 100% { transform: translateY(2px); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes circleVis {
    0%, 38% { opacity: 1; transform: scale(1);   animation-timing-function: var(--inout); }
    46%, 88% { opacity: 0; transform: scale(.55); animation-timing-function: var(--out); }
    96%, 100% { opacity: 1; transform: scale(1); }
  }

  /* Scene: document -> drive -> lock */
  .scene { display: grid; place-items: center; opacity: 0; animation: sceneVis var(--cycle) linear infinite; }
  .scene > * { grid-area: 1 / 1; position: relative; }
  @keyframes sceneVis {
    0%, 38% { opacity: 0; transform: scale(.88); animation-timing-function: var(--out); }
    46%, 83% { opacity: 1; transform: scale(1); animation-timing-function: var(--inout); }
    90%, 100% { opacity: 0; transform: scale(.94); }
  }

  .drive {
    z-index: 2; width: 62px; height: 42px; border-radius: 11px;
    background: #4d84ff; border: 1.5px solid rgba(255,255,255,.7);
    animation: drivePulse var(--cycle) linear infinite;
  }
  @keyframes drivePulse {
    0%, 55% { transform: scale(1);    animation-timing-function: var(--out); }
    59%     { transform: scale(1.06); animation-timing-function: var(--inout); }
    66%, 100% { transform: scale(1); }
  }
  .slot { position: absolute; top: 9px; left: 10px; right: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.75); }
  .track { position: absolute; bottom: 9px; left: 10px; width: 30px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
  .fill { height: 100%; background: #fff; transform: scaleX(0); transform-origin: left; animation: fill var(--cycle) linear infinite; }
  @keyframes fill {
    0%, 45.5% { transform: scaleX(0); animation-timing-function: var(--inout); }
    59%, 100% { transform: scaleX(1); }
  }
  .led { position: absolute; bottom: 8.5px; right: 11px; width: 5px; height: 5px; border-radius: 50%; background: #fff; opacity: .5; animation: led var(--cycle) linear infinite; }
  @keyframes led {
    0%, 45.5% { opacity: .5; animation-timing-function: ease-in-out; }
    49% { opacity: 1; animation-timing-function: ease-in-out; }
    52.7% { opacity: .5; animation-timing-function: ease-in-out; }
    56.4% { opacity: 1; animation-timing-function: ease-in-out; }
    61%, 100% { opacity: .5; }
  }

  .doc {
    z-index: 1; width: 22px; height: 28px; border-radius: 4px; background: #fff; opacity: 0;
    animation: doc var(--cycle) linear infinite;
  }
  .doc::before {
    content: ""; position: absolute; left: 5px; right: 5px; top: 8px; height: 2px; border-radius: 1px;
    background: rgba(26,92,255,.4); box-shadow: 0 5px 0 rgba(26,92,255,.4), 0 10px 0 rgba(26,92,255,.4);
  }
  @keyframes doc {
    0%, 40% { opacity: 0; transform: translateY(40px) scale(1);  animation-timing-function: var(--out); }
    46.7%   { opacity: 1; transform: translateY(26px) scale(1);  animation-timing-function: var(--inout); }
    59%     { opacity: 1; transform: translateY(0)    scale(.9); animation-timing-function: ease-out; }
    61%, 100% { opacity: 0; transform: translateY(0)  scale(.9); }
  }

  .lock {
    z-index: 3; justify-self: end; align-self: end; margin: 0 -2px -4px 0;
    width: 24px; height: 24px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.22); transform: scale(0); opacity: 0;
    animation: lockPop var(--cycle) linear infinite;
  }
  @keyframes lockPop {
    0%, 60% { transform: scale(0) rotate(-12deg); opacity: 0; animation-timing-function: var(--spring); }
    67.5%   { transform: scale(1) rotate(0);      opacity: 1; animation-timing-function: linear; }
    82%     { transform: scale(1) rotate(0);      opacity: 1; animation-timing-function: var(--inout); }
    88%, 100% { transform: scale(0) rotate(0);    opacity: 0; }
  }
  .lock svg { width: 14px; height: 14px; overflow: visible; }
  .lock .body { fill: #1a5cff; }
  .lock .shackle { fill: none; stroke: #1a5cff; stroke-width: 2.2; stroke-linecap: round; transform-box: fill-box; animation: shackle var(--cycle) linear infinite; }
  @keyframes shackle {
    0%, 65% { transform: translateY(-2.5px); animation-timing-function: var(--spring); }
    71%, 100% { transform: translateY(0); }
  }

  /* Labels */
  .labels { display: grid; place-items: center; width: 200px; height: 48px; }
  .labels span { grid-area: 1 / 1; font-size: 18px; font-weight: 700; line-height: 1.3; text-align: center; letter-spacing: .1px; }
  .l-idle  { animation: lIdle var(--cycle) linear infinite; }
  .l-up    { opacity: 0; animation: lUp var(--cycle) linear infinite; }
  .l-saved { opacity: 0; animation: lSaved var(--cycle) linear infinite; }

  @keyframes lIdle {
    0%, 38% { opacity: 1; transform: translateY(0);    filter: blur(0);   animation-timing-function: var(--inout); }
    44%, 88% { opacity: 0; transform: translateY(-8px); filter: blur(4px); animation-timing-function: var(--out); }
    96%, 100% { opacity: 1; transform: translateY(0);   filter: blur(0); }
  }
  @keyframes lUp {
    0%, 40.7% { opacity: 0; transform: translateY(8px);  filter: blur(4px); animation-timing-function: var(--out); }
    46.1%   { opacity: 1; transform: translateY(0);    filter: blur(0);   animation-timing-function: linear; }
    56.4%   { opacity: 1; transform: translateY(0);    filter: blur(0);   animation-timing-function: var(--inout); }
    62.4%, 100% { opacity: 0; transform: translateY(-8px); filter: blur(4px); }
  }
  @keyframes lSaved {
    0%, 58.9% { opacity: 0; transform: translateY(8px);  filter: blur(4px); animation-timing-function: var(--out); }
    66.2%   { opacity: 1; transform: translateY(0);    filter: blur(0);   animation-timing-function: linear; }
    82%     { opacity: 1; transform: translateY(0);    filter: blur(0);   animation-timing-function: var(--inout); }
    88%, 100% { opacity: 0; transform: translateY(-8px); filter: blur(4px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .circle, .circle::after, .circle svg, .scene, .drive, .fill, .led, .doc, .lock, .shackle, .labels span { animation: none; }
    .lock, .scene { opacity: 0; }
  }
</style>
</head>
<body>

<button class="upload" type="button" aria-label="Upload document to your private drive">
  <span class="glow"></span>

  <span class="stage">
    <span class="circle">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/><path d="M12 15V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/>
      </svg>
    </span>

    <span class="scene" aria-hidden="true">
      <span class="doc"></span>
      <span class="drive">
        <span class="slot"></span>
        <span class="track"><span class="fill"></span></span>
        <span class="led"></span>
      </span>
      <span class="lock">
        <svg viewBox="0 0 24 24">
          <path class="shackle" d="M8 11V8a4 4 0 018 0v3"/>
          <rect class="body" x="5" y="11" width="14" height="10" rx="2.5"/>
        </svg>
      </span>
    </span>
  </span>

  <span class="labels">
    <span class="l-idle">Upload<br>Document</span>
    <span class="l-up">Uploading…</span>
    <span class="l-saved">Saved to<br>Private Drive</span>
  </span>
</button>

</body>
</html>
