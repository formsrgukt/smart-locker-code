<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favorites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --out: cubic-bezier(.16, 1, .3, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --ink: #0f172a;
    --text: #5b6b86;
    --red: #ef4444;
    --T: 5.6s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    font-family: Lexend, Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: #f9fafc;
  }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 16px; padding: 20px; }
  .tile { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; background: #ffe1e3; flex: none; }
  .tile svg { width: 28px; height: 28px; fill: #ef1c2e; stroke: #ef1c2e; stroke-width: 1.5; stroke-linejoin: round; animation: tileBeat 2.8s ease-in-out infinite; }
  @keyframes tileBeat { 0%, 70%, 100% { scale: 1; } 78% { scale: 1.16; } 86% { scale: 1; } 92% { scale: 1.1; } }
  header h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; font-size: 16px; color: var(--text); }

  /* ---------- empty state ---------- */
  main { flex: 1; display: grid; place-items: center; padding: 16px 20px 80px; }
  .empty { display: grid; justify-items: center; text-align: center; }

  .stage { position: relative; width: 280px; height: 230px; }
  .stage > * { position: absolute; }

  /* big heart (the destination) */
  .big { left: 50%; top: 14px; width: 92px; height: 92px; margin-left: -46px; animation: breathe 2.8s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scale(.96); } to { transform: scale(1.04); } }
  .big svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; stroke-linejoin: round; }
  .big .line { fill: none; stroke: #dbe3ee; stroke-width: 2.4; }
  .big .fill { fill: url(#hg); stroke: none; opacity: 0; transform-origin: 50% 55%; animation: bigFill var(--T) linear infinite; filter: drop-shadow(0 10px 14px rgba(239,68,68,.35)); }
  @keyframes bigFill {
    0%, 56%  { opacity: 0; transform: scale(.6); }
    60%      { opacity: 1; transform: scale(1.25); animation-timing-function: ease-in-out; }
    64%      { transform: scale(.94); }
    67%      { transform: scale(1.1); }
    70%, 82% { opacity: 1; transform: scale(1); }
    91%, 100%{ opacity: 0; transform: scale(.9); }
  }
  .ring { left: 50%; top: 14px; width: 92px; height: 92px; margin-left: -46px; border-radius: 50%; border: 3px solid #fda4af; opacity: 0; animation: ring var(--T) ease-out infinite; }
  @keyframes ring { 0%, 58% { opacity: 0; scale: .6; } 60% { opacity: .7; scale: .8; } 74%, 100% { opacity: 0; scale: 2; } }

  /* sparkles around big heart */
  .sp { left: 50%; top: 60px; width: 7px; height: 7px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fb7185; opacity: 0; animation: spark var(--T) ease-out infinite; }
  .sp:nth-of-type(odd) { background: #fbbf24; width: 6px; height: 6px; }
  @keyframes spark { 0%, 59% { opacity: 0; translate: 0 0; scale: .3; } 62% { opacity: 1; } 76%, 100% { opacity: 0; translate: var(--x) var(--y); scale: 1; } }

  /* file card */
  .card {
    left: 50%; top: 122px; width: 96px; height: 100px; margin-left: -48px; padding: 10px 10px; border-radius: 14px;
    background: #fff; border: 1px solid #e6ebf5; box-shadow: 0 14px 26px -12px rgba(30,41,90,.35);
    display: grid; align-content: start; gap: 7px; opacity: 0; animation: card var(--T) linear infinite;
  }
  @keyframes card {
    0%       { opacity: 0; transform: translateY(26px) scale(.9); animation-timing-function: cubic-bezier(.16,1,.3,1); }
    12.5%    { opacity: 1; transform: none; }
    46%      { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.5,0,.9,.4); }
    59%      { opacity: 0; transform: translateY(-78px) scale(.28); }
    100%     { opacity: 0; transform: translateY(-78px) scale(.28); }
  }
  .card .tag { justify-self: start; font-size: 9px; font-weight: 700; letter-spacing: .05em; color: #fff; background: #ef4444; padding: 2px 6px; border-radius: 5px; }
  .card .ln { display: block; height: 4px; border-radius: 2px; background: #e3e8f4; }
  .card .ln.s { width: 60%; }
  .card .name { margin-top: 2px; font-size: 10px; font-weight: 600; color: #3b4a68; }

  .heart-btn {
    position: absolute; right: 7px; top: 7px; width: 22px; height: 22px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px -2px rgba(30,41,90,.35); display: grid; place-items: center; overflow: visible;
  }
  .heart-btn svg { width: 13px; height: 13px; stroke-width: 2.4; stroke-linejoin: round; fill: transparent; stroke: #b4bfd3; animation: mini var(--T) linear infinite; }
  @keyframes mini {
    0%, 33%  { fill: transparent; stroke: #b4bfd3; scale: 1; }
    34%      { fill: var(--red); stroke: var(--red); scale: 1.6; animation-timing-function: ease-out; }
    39%, 100%{ fill: var(--red); stroke: var(--red); scale: 1; }
  }
  .bp { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: #fb7185; opacity: 0; animation: burst var(--T) ease-out infinite; }
  @keyframes burst { 0%, 33% { opacity: 0; translate: 0 0; scale: .4; } 35% { opacity: 1; } 45%, 100% { opacity: 0; translate: var(--x) var(--y); scale: 1; } }

  /* cursor */
  .cursor { left: 50%; top: 0; width: 22px; height: 22px; margin-left: 0; opacity: 0; z-index: 5; pointer-events: none; filter: drop-shadow(0 3px 4px rgba(15,23,42,.35)); animation: cursor var(--T) linear infinite; }
  .cursor svg { width: 100%; height: 100%; display: block; }
  @keyframes cursor {
    0%, 14%  { opacity: 0; translate: 120px 190px; scale: 1; }
    18%      { opacity: 1; translate: 110px 180px; animation-timing-function: cubic-bezier(.65,0,.35,1); }
    32%      { opacity: 1; translate: 28px 128px; scale: 1; }
    34%      { translate: 28px 128px; scale: .8; }
    37%      { translate: 28px 128px; scale: 1; }
    46%      { opacity: 1; translate: 40px 142px; }
    52%, 100%{ opacity: 0; translate: 52px 156px; }
  }

  /* text */
  h2 { margin: 6px 0 12px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; animation: textIn .9s var(--out) both; }
  .empty p { margin: 0; max-width: 460px; font-size: 18px; line-height: 1.55; color: var(--text); animation: textIn .9s var(--out) .12s both; }
  @keyframes textIn { from { opacity: 0; transform: translateY(12px); } }

  @media (max-width: 520px) {
    header h1 { font-size: 26px; }
    h2 { font-size: 23px; }
    .empty p { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .card, .cursor, .ring, .sp, .bp { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.500-4.600-9.600-9.300C.9 8.200 2.800 4.500 6.400 4.500c2.100 0 3.700 1.100 5.600 3.100 1.900-2 3.500-3.100 5.600-3.100 3.600 0 5.500 3.700 4 7.200C19.500 16.400 12 21 12 21z"/></svg></div>
  <div>
    <h1>Favorites</h1>
    <p>Your most important files and documents.</p>
  </div>
</header>

<main>
  <section class="empty">
    <div class="stage" aria-hidden="true">
      <!-- destination heart -->
      <div class="ring"></div>
      <div class="big">
        <svg viewBox="0 0 24 24">
          <defs>
            <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b7f"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
          </defs>
          <path class="fill" d="M12 21s-7.500-4.600-9.600-9.300C.9 8.200 2.800 4.500 6.400 4.500c2.100 0 3.700 1.100 5.600 3.100 1.900-2 3.500-3.100 5.600-3.100 3.600 0 5.500 3.700 4 7.200C19.500 16.400 12 21 12 21z"/>
          <path class="line" d="M12 21s-7.500-4.600-9.600-9.300C.9 8.200 2.800 4.500 6.400 4.500c2.100 0 3.700 1.100 5.600 3.100 1.900-2 3.500-3.100 5.600-3.100 3.600 0 5.500 3.700 4 7.200C19.500 16.400 12 21 12 21z"/>
        </svg>
      </div>

      <i class="sp" style="--x:-62px;--y:-34px"></i>
      <i class="sp" style="--x:60px;--y:-40px"></i>
      <i class="sp" style="--x:-74px;--y:6px"></i>
      <i class="sp" style="--x:72px;--y:10px"></i>
      <i class="sp" style="--x:-30px;--y:-62px"></i>
      <i class="sp" style="--x:34px;--y:-60px"></i>

      <!-- file card with its own heart button -->
      <div class="card">
        <b class="tag">PDF</b>
        <i class="ln"></i><i class="ln"></i><i class="ln s"></i>
        <span class="name">Passport.pdf</span>
        <span class="heart-btn">
          <i class="bp" style="--x:-16px;--y:-14px"></i>
          <i class="bp" style="--x:15px;--y:-16px"></i>
          <i class="bp" style="--x:-19px;--y:4px"></i>
          <i class="bp" style="--x:18px;--y:6px"></i>
          <i class="bp" style="--x:0px;--y:-22px"></i>
          <i class="bp" style="--x:-4px;--y:18px"></i>
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.500-4.600-9.600-9.300C.9 8.200 2.800 4.500 6.400 4.500c2.100 0 3.700 1.100 5.600 3.100 1.900-2 3.500-3.100 5.600-3.100 3.600 0 5.500 3.700 4 7.200C19.500 16.400 12 21 12 21z"/></svg>
        </span>
      </div>

      <!-- cursor -->
      <div class="cursor"><svg viewBox="0 0 24 24"><path d="M4 2l15 9.500-6.500 1.500 3.500 7-3 1.500-3.500-7L4 19.500z" fill="#0f172a" stroke="#fff" stroke-width="1.600" stroke-linejoin="round"/></svg></div>
    </div>

    <h2>No favorites yet</h2>
    <p>Click the heart icon on any file to add it to your favorites.</p>
  </section>
</main>

</body>
</html>
